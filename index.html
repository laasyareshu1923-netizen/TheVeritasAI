<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veritas AI Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Left Side: Ingestion Panel -->
        <div class="panel ingestion-panel">
            <h2>⚙️ Live Network Feed Ingestion</h2>
            <label>Select Verification Scope Tier:</label>
            <select id="scopeTier">
                <option value="global">Global News Tier</option>
                <option value="national">National News Tier</option>
                <option value="local">Local News Tier</option>
            </select>

            <div class="input-container">
                <label>📍 Enter Target City / Region:</label>
                <input type="text" id="targetCity" value="Visakhapatnam" placeholder="e.g. Visakhapatnam, Patna">
            </div>

            <div class="input-container">
                <label>📝 Paste News Content / Transcript Here:</label>
                <textarea id="newsContent" rows="6">powerful 7.4-magnitude earthquake struck western Colombia, claiming at least 111 lives, injuring nearly 600, and triggering a national state of disaster</textarea>
            </div>

            <button id="executeBtn" onclick="runVeritasVerification()">Execute Direct Fact Verification</button>
        </div>

        <!-- Right Side: Real-Time Results Matrix Matrix -->
        <div class="panel results-panel">
            <h2>📊 Independent Validation Results Matrix</h2>
            
            <div id="alertBox" class="alert-box waiting">
                <h3 id="alertTitle">System Idle</h3>
                <p id="alertBody">Ready for incoming text validation check.</p>
            </div>

            <div class="consensus-container">
                <h2>🎯 System Consensus Score</h2>
                <p>Network Verification Match Index</p>
                <div class="score-display" id="scoreValue">-- / 100</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                </div>
                <p class="status-footer" id="statusFooter">Status Status: Awaiting operational input stream.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
